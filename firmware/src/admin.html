<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>{{title}} · Waypin Box</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/admin.css">
<script type="module" src="/admin.js"></script>
</head>
<body data-admin-page="{{page}}">
<div class="admin-shell">
<header class="admin-header"><div class="brand"><span class="brand-mark" data-lucide="locate-fixed" aria-hidden="true"></span><h1 class="brand-name">Waypin Box<small>移点盒设置</small></h1><span id="admin-connection" class="connection" data-online="false" role="status"><i aria-hidden="true"></i><span id="admin-connection-label">连接中</span></span><span id="admin-preview-label" class="preview-label" hidden>交互预览</span></div><a class="muted-button back-link" href="/"><span data-lucide="arrow-right" aria-hidden="true"></span>返回定位</a></header>
<div class="admin-toolbar"><button id="admin-restore" class="secondary" type="button" disabled><span data-lucide="rotate-ccw" aria-hidden="true"></span><span id="admin-restore-label">恢复真实定位</span></button><div><button id="refresh-admin" class="muted-button" type="button"><span data-lucide="rotate-ccw" aria-hidden="true"></span>刷新状态</button><button id="export-diagnostics" class="secondary" type="button" disabled><span data-lucide="download" aria-hidden="true"></span>导出诊断</button></div></div>
<p id="admin-preview-notice" class="preview-notice" hidden>预览中的系统、Wi-Fi 和定位为样例状态，不会操作盒子或手机。</p>
<p id="admin-offline" class="offline-banner" role="status" hidden>无法连接盒子，请检查供电和 Wi-Fi。页面会自动重新连接。</p>
<label class="admin-page-picker"><span class="sr-only">设置项目</span><select id="admin-page-select"><option value="/admin">系统信息</option><option value="/admin/network">Wi-Fi 连接</option><option value="/admin/maps">地图服务</option><option value="/admin/location">定位调试</option><option value="/admin/help">使用帮助</option></select></label>
<div class="admin-layout">
<nav class="admin-nav" aria-label="管理区域"><a href="/admin">系统信息</a><a href="/admin/network">Wi-Fi 连接</a><a href="/admin/maps">地图服务</a><a href="/admin/location">定位调试</a><a href="/admin/help">使用帮助</a></nav>
<main class="admin-content">
{{content}}
</main>
</div>
</div>

<div id="admin-toast" class="toast" role="status" hidden></div>
</body>
</html>
