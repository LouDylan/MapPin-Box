<section id="location" class="admin-section" aria-labelledby="location-title"><div class="section-heading"><h2 id="location-title">定位调试</h2><span id="location-mode" class="section-meta">—</span></div><dl class="info-grid"><div><dt>盒子保存的手机</dt><dd id="configured-phone">—</dd></div><div><dt>配对资料</dt><dd id="pairing-status">—</dd></div><div><dt>已记录的手机地址</dt><dd id="phone-address">—</dd></div><div><dt>上次成功地点</dt><dd id="last-location">暂无记录</dd></div><div><dt>上次实体按键</dt><dd id="last-button">暂无操作</dd></div></dl><p id="location-progress" class="inline-message" role="status">等待操作。</p><div class="form-actions"><button id="replay-location" class="secondary" type="button" disabled><span data-lucide="history" aria-hidden="true"></span>重新使用上次地点</button></div><details class="admin-details"><summary>手动坐标测试</summary><form id="manual-form" class="admin-form" novalidate><label for="manual-name">地点名称</label><input id="manual-name" type="text" placeholder="临时地点" autocomplete="off"><label for="manual-coordinates">WGS84 坐标</label><input id="manual-coordinates" type="text" placeholder="纬度, 经度" autocomplete="off" spellcheck="false"><div class="form-actions"><button id="manual-apply" class="primary" type="submit">测试定位</button><button id="manual-save" class="secondary" type="button">保存收藏</button></div><p id="manual-message" class="inline-message" role="status" hidden></p></form></details></section>
